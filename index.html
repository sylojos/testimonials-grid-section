<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/style.css" />

    <title>Frontend Mentor | Testimonials grid section</title>
  </head>
  <body>
    <main class="pis-35 pie-35 pbs-73 pbe-73">
      <section class="grid gap-row-32">
        <h1 class="visually-hidden">Testimonials</h1>
        <figure
          class="bg-purple-500 flex flex-col gap-row-16 p-32 testimonial rounded-8"
        >
          <figcaption class="flex gap-col-16 items-center purple-ring">
            <div>
              <img
                class="rounded-full"
                src="images/image-daniel.jpg"
                alt=""
                width="56"
                height="56"
              />
            </div>
            <div class="font-medium">
              <p class="font-size-13 text-purple-50">Daniel Clifford</p>
              <p class="font-size-11 text-grey-200">Verified Graduate</p>
            </div>
          </figcaption>
          <blockquote>
            <p
              class="font-size-20 font-semibold line-height-1p2 text-purple-50 mbe-16"
            >
              I received a job offer mid-course, and the subjects I learned were
              current, if not more so, in the company I joined. I honestly feel
              I got every penny&#x2019;s worth.
            </p>
            <p class="font-size-13 font-medium line-height-1p4 text-grey-200">
              “ I was an EMT for many years before I joined the bootcamp.
              I&#x2019;ve been looking to make a transition and have heard some
              people who had an amazing experience here. I signed up for the
              free intro course and found it incredibly fun! I enrolled shortly
              thereafter. The next 12 weeks was the best - and most grueling -
              time of my life. Since completing the course, I&#x2019;ve
              successfully switched careers, working as a Software Engineer at a
              VR startup. ”
            </p>
          </blockquote>
        </figure>

        <figure
          class="bg-grey-500 flex flex-col gap-row-16 p-32 testimonial rounded-8"
        >
          <figcaption class="flex items-center gap-col-16">
            <div>
              <img
                class="rounded-full"
                src="images/image-jonathan.jpg"
                alt=""
                width="56"
                height="56"
              />
            </div>
            <div class="font-medium">
              <p class="font-size-13 text-grey-100">Jonathan Walters</p>
              <p class="font-size-11 text-grey-200">Verified Graduate</p>
            </div>
          </figcaption>
          <blockquote>
            <p
              class="font-size-20 font-semibold line-height-1p2 text-grey-100 mbe-16"
            >
              The team was very supportive and kept me motivated
            </p>
            <p class="font-size-13 font-medium line-height-1p4 text-grey-200">
              “ I started as a total newbie with virtually no coding skills. I
              now work as a mobile engineer for a big company. This was one of
              the best investments I&#x2019;ve made in myself. ”
            </p>
          </blockquote>
        </figure>

        <figure
          class="bg-white flex flex-col gap-row-16 p-32 testimonial rounded-8"
        >
          <figcaption class="flex items-center gap-col-16">
            <div>
              <img
                class="rounded-full"
                src="images/image-jeanette.jpg"
                alt=""
                width="56"
                height="56"
              />
            </div>
            <div class="font-medium">
              <p class="font-size-13 text-grey-500">Jeanette Harmon</p>
              <p class="font-size-11 text-grey-400">Verified Graduate</p>
            </div>
          </figcaption>
          <blockquote>
            <p
              class="font-size-20 font-semibold line-height-1p2 text-grey-500 mbe-16"
            >
              An overall wonderful and rewarding experience
            </p>
            <p class="font-size-13 font-medium line-height-1p4 text-grey-400">
              “ Thank you for the wonderful experience! I now have a job I
              really enjoy, and make a good living while doing something I love.
              ”
            </p>
          </blockquote>
        </figure>

        <figure
          class="text-grey-200 bg-dark-blue flex flex-col gap-row-16 p-32 testimonial rounded-8"
        >
          <figcaption class="flex items-center gap-col-16 purple-ring">
            <div>
              <img
                class="rounded-full"
                src="images/image-patrick.jpg"
                alt=""
                width="56"
                height="56"
              />
            </div>
            <div class="font-medium">
              <p class="font-size-13">Patrick Abrams</p>
              <p class="font-size-11">Verified Graduate</p>
            </div>
          </figcaption>
          <blockquote>
            <p class="font-size-20 font-semibold line-height-1p2 mbe-16">
              Awesome teaching support from TAs who did the bootcamp themselves.
              Getting guidance from them and learning from their experiences was
              easy.
            </p>
            <p class="font-size-13 font-medium line-height-1p4">
              “ The staff seem genuinely concerned about my progress which I
              find really refreshing. The program gave me the confidence
              necessary to be able to go out in the world and present myself as
              a capable junior developer. The standard is above the rest. You
              will get the personal attention you need from an incredible
              community of smart and amazing people. ”
            </p>
          </blockquote>
        </figure>

        <figure
          class="bg-white flex flex-col gap-row-16 p-32 testimonial rounded-8"
        >
          <figcaption class="flex items-center gap-col-16">
            <div>
              <img
                class="rounded-full"
                src="images/image-kira.jpg"
                alt=""
                width="56"
                height="56"
              />
            </div>
            <div class="font-medium">
              <p class="font-size-13 text-grey-500">Kira Whittle</p>
              <p class="font-size-11 text-grey-400">Verified Graduate</p>
            </div>
          </figcaption>
          <blockquote>
            <p
              class="font-size-20 font-semibold line-height-1p2 text-grey-500 mbe-16"
            >
              Such a life-changing experience. Highly recommended!
            </p>
            <p class="font-size-13 font-medium line-height-1p4 text-grey-400">
              “ Before joining the bootcamp, I&#x2019;ve never written a line of
              code. I needed some structure from professionals who can help me
              learn programming step by step. I was encouraged to enroll by a
              former student of theirs who can only say wonderful things about
              the program. The entire curriculum and staff did not disappoint.
              They were very hands-on and I never had to wait long for
              assistance. The agile team project, in particular, was
              outstanding. It took my learning to the next level in a way that
              no tutorial could ever have. In fact, I&#x2019;ve often referred
              to it during interviews as an example of my developent experience.
              It certainly helped me land a job as a full-stack developer after
              receiving multiple offers. 100% recommend! ”
            </p>
          </blockquote>
        </figure>
      </section>
    </main>
  </body>
</html>
